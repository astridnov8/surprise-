<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Kameron 💖</title>
<style>
body {
  margin: 0;
  height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  overflow: hidden;
  color: white;
}

.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  padding: 40px 50px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 0 40px rgba(255,105,180,0.2);
  animation: fadeIn 2s ease;
  max-width: 90%;
}

h1 { color: #ff6fae; }

button {
  padding: 12px 30px;
  border: none;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  margin: 12px;
  transition: 0.3s;
}

#yesBtn {
  background: linear-gradient(45deg, #ff6fae, #ff9ad5);
  color: white;
}
#yesBtn:hover { transform: scale(1.1); }

#noBtn {
  background: #555;
  color: white;
}

textarea {
  width: 90%;
  height: 120px;
  border-radius: 15px;
  border: none;
  padding: 12px;
  font-size: 16px;
}

.confetti, .heart {
  position: absolute;
  animation: fall 3s linear forwards;
}

.heart {
  font-size: 24px;
}

@keyframes fall {
  0% {transform: translateY(0) rotate(0deg); opacity:1;}
  100% {transform: translateY(100vh) rotate(360deg); opacity:0;}
}

@keyframes fadeIn {
  from {opacity:0;}
  to {opacity:1;}
}

.typing {
  border-right: 2px solid #ff6fae;
  white-space: nowrap;
  overflow: hidden;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<div class="card" id="card">
  <h1>Hey Kameron 💖</h1>
  <p>I made this just for you…</p>
  <p>So tell me honestly 😌</p>

  <h2>Are you happy that we met?</h2>

  <button id="yesBtn">Yes 💕</button>
  <button id="noBtn">Hmm 🤔</button>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const card = document.getElementById("card");
const music = document.getElementById("music");

document.body.addEventListener("click", () => {
  music.play();
},{once:true});

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);

function moveButton() {
  const cardRect = card.getBoundingClientRect();
  const x = cardRect.left + Math.random() * (cardRect.width - 120);
  const y = cardRect.top + Math.random() * (cardRect.height - 60);
  noBtn.style.position = "absolute";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

yesBtn.addEventListener("click", () => {
  card.innerHTML = `
    <h1>That makes me smile, Kameron 💖</h1>
    <p class="typing" id="typingText"></p>
    <button id="reasonBtn">Tell me why you feel that way 💌</button>
  `;
  typeText("Meeting you was a beautiful coincidence ✨", "typingText");
  startConfetti();

  document.getElementById("reasonBtn").addEventListener("click", showReasonBox);
});

function showReasonBox(){
  card.innerHTML = `
    <h2>Your words mean a lot to me 💖</h2>
    <p>Please write your reason here:</p>
    <textarea id="reasonInput" placeholder="Type your reason here..."></textarea><br>
    <button id="sendBtn">Send 💌</button>
  `;

  document.getElementById("sendBtn").addEventListener("click", sendReason);
}

function sendReason(){
  const reason = document.getElementById("reasonInput").value;
  if(reason.trim() === ""){
    alert("Please write something first 💕");
    return;
  }

  card.innerHTML = `
    <h2>Sending your words to her… 💖</h2>
    <p>Please wait a moment ✨</p>
  `;

  heartAnimation();

  const message = `Kameron said YES 💖\nReason: ${reason}`;
  setTimeout(() => {
    window.location.href = "https://wa.me/6282295358933?text=" + encodeURIComponent(message);
  }, 2000);

  setTimeout(showFinalPage, 4000);
}

function showFinalPage(){
  card.innerHTML = `
    <h1>She has received your answer 💖</h1>
    <p>Now it’s your turn to tell her how you feel after opening this link 😌</p>
    <button onclick="exitToChat()">Exit & text her 💌</button>
  `;
}

function exitToChat(){
  const msg = "I just opened your link and it made me feel...";
  window.location.href = "https://wa.me/6282295358933?text=" + encodeURIComponent(msg);
}

function startConfetti(){
  for(let i=0;i<120;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*window.innerWidth+"px";
    c.style.background=`hsl(${Math.random()*360},100%,70%)`;
    c.style.width="10px";
    c.style.height="10px";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}

function heartAnimation(){
  for(let i=0;i<30;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*window.innerWidth+"px";
    h.style.top="0px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),3000);
  }
}

function typeText(text,id){
  let i=0;
  const el=document.getElementById(id);
  const interval=setInterval(()=>{
    el.innerHTML += text.charAt(i);
    i++;
    if(i>=text.length) clearInterval(interval);
  },80);
}
</script>

</body>
</html>
