<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>For Kameron 💖</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #0f0f1a, #1a0026);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  padding: 15px;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 25px 20px;
  border-radius: 20px;
  text-align: center;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 0 25px rgba(255,105,180,0.3);
  position: relative;
  overflow: hidden;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
}

p {
  font-size: 15px;
  line-height: 1.5;
}

.buttons {
  margin-top: 20px;
}

button {
  width: 80%;
  max-width: 260px;
  margin: 10px auto;
  padding: 14px;
  border-radius: 30px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  transition: 0.2s;
}

#yesBtn {
  background: hotpink;
  color: white;
}

#noBtn {
  background: #444;
  color: #ddd;
  position: relative;
}

.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  animation: fall 2s linear forwards;
}

@keyframes fall {
  from { transform: translateY(-20px); }
  to { transform: translateY(100vh); }
}

.heart {
  position: absolute;
  animation: floatUp 2s ease-in forwards;
  font-size: 20px;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-120px); opacity: 0; }
}
</style>
</head>
<body>

<div class="card" id="card">
  <h1 id="typing"></h1>
  <p>Are you happy that we met?</p>

  <div class="buttons">
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 😏</button>
  </div>
</div>

<script>
const card = document.getElementById("card");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

const text = "Hey Kameron 💖";
let i = 0;

function typingEffect(){
  if(i < text.length){
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typingEffect, 100);
  }
}
typingEffect();

// NO button move slightly (mobile friendly)
noBtn.addEventListener("touchstart", moveButton);
noBtn.addEventListener("click", moveButton);

function moveButton(){
  const cardRect = card.getBoundingClientRect();

  const x = Math.random() * (cardRect.width - 140);
  const y = Math.random() * (cardRect.height - 120);

  noBtn.style.position = "absolute";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

yesBtn.addEventListener("click", () => {
  card.innerHTML = `
    <h1>I'm really happy we met 💖</h1>
    <p>
      Meeting you was a beautiful coincidence ✨<br><br>
      It makes me smile knowing that somehow our paths crossed.<br>
      I hope this is the beginning of something sweet and meaningful 🌙
    </p>
  `;

  startConfetti();
  heartAnimation();
});

function startConfetti(){
  for(let i=0;i<25;i++){
    const confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random()*100 + "vw";
    confetti.style.background = ["hotpink","#ffb6c1","white"][Math.floor(Math.random()*3)];
    document.body.appendChild(confetti);
    setTimeout(()=>confetti.remove(),2000);
  }
}

function heartAnimation(){
  for(let i=0;i<12;i++){
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random()*100 + "%";
    heart.style.bottom = "0px";
    card.appendChild(heart);
    setTimeout(()=>heart.remove(),2000);
  }
}
</script>

</body>
</html>
