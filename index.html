<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For Kameron 💖</title>
<style>
body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  background: #0d0d0d;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: #1a1a1a;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  width: 90%;
  max-width: 400px;
  box-shadow: 0 0 20px rgba(255,0,150,0.3);
  position: relative;
  overflow: hidden;
}

button {
  margin: 10px;
  padding: 12px 20px;
  border-radius: 25px;
  border: none;
  cursor: pointer;
  font-size: 16px;
}

#yesBtn {
  background: hotpink;
  color: white;
}

#noBtn {
  background: #444;
  color: white;
  position: relative;
}

textarea {
  width: 90%;
  height: 120px;
  border-radius: 15px;
  padding: 10px;
  border: none;
  margin-top: 10px;
  font-size: 16px;
}

.hearts {
  position: relative;
  height: 100px;
  overflow: hidden;
}

.heart {
  position: absolute;
  bottom: 0;
  animation: floatUp 2s ease-in forwards;
  font-size: 24px;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-120px); opacity: 0; }
}

.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  background: pink;
  animation: fall 2s linear forwards;
}

@keyframes fall {
  from { transform: translateY(0); }
  to { transform: translateY(100vh); }
}
</style>
</head>
<body>

<div class="card" id="card">
  <h1 id="typing"></h1>
  <p>Are you happy that we met?</p>
  <button id="yesBtn">Yes 💕</button>
  <button id="noBtn">No 😏</button>
</div>

<script>
const card = document.getElementById("card");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const typingText = "Hey Kameron 💖";

let index = 0;
function typeEffect(){
  if(index < typingText.length){
    document.getElementById("typing").innerHTML += typingText.charAt(index);
    index++;
    setTimeout(typeEffect, 100);
  }
}
typeEffect();

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);

function moveButton(){
  const cardRect = card.getBoundingClientRect();
  const x = Math.random() * (cardRect.width - 100);
  const y = Math.random() * (cardRect.height - 50);
  noBtn.style.position = "absolute";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

yesBtn.addEventListener("click", () => {
  card.innerHTML = `
    <h1>That makes me smile, Kameron 💖</h1>
    <p>Meeting you was a beautiful coincidence ✨</p>
    <button id="reasonBtn">Tell me why you feel that way 💌</button>
  `;
  startConfetti();

  document.getElementById("reasonBtn").addEventListener("click", showReasonInput);
});

function showReasonInput(){
  card.innerHTML = `
    <h2>Your reason means a lot to me 💖</h2>
    <textarea id="reasonInput" placeholder="Type your reason here..."></textarea>
    <br>
    <button onclick="sendReason()">Send 💌</button>
  `;
}

function sendReason(){
  const reason = document.getElementById("reasonInput").value;
  if(reason.trim() === ""){
    alert("Please write something first 💕");
    return;
  }

  const message = `Kameron said YES 💖\nReason: ${reason}`;

  card.innerHTML = `
    <h2>Sending your words to her… 💖</h2>
    <p>Your message is ready ✨</p>
    <div class="hearts"></div>
    <button id="openWA">Open WhatsApp 💌</button>
  `;

  heartAnimation();

  document.getElementById("openWA").addEventListener("click", () => {
    window.open(
      "https://wa.me/6282295368933?text=" + encodeURIComponent(message),
      "_blank"
    );
    showFinalPage();
  });
}

function showFinalPage(){
  card.innerHTML = `
    <h1>She has received your answer 💖</h1>
    <p>Now go and text her how you feel after opening this link 😌</p>
    <button onclick="exitToChat()">Exit & text her 💌</button>
  `;
}

function exitToChat(){
  const msg = "I just opened your link and it made me feel...";
  window.open(
    "https://wa.me/6282295368933?text=" + encodeURIComponent(msg),
    "_blank"
  );
}

function heartAnimation(){
  const heartsContainer = document.querySelector(".hearts");
  for(let i=0;i<15;i++){
    const heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "%";
    heartsContainer.appendChild(heart);
    setTimeout(()=>heart.remove(),2000);
  }
}

function startConfetti(){
  for(let i=0;i<30;i++){
    const confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random()*100 + "vw";
    confetti.style.background = ["pink","hotpink","white"][Math.floor(Math.random()*3)];
    document.body.appendChild(confetti);
    setTimeout(()=>confetti.remove(),2000);
  }
}
</script>

</body>
</html>
